# Betrieb auf dem VPS: docker compose up -d
# Konfiguration in .env (Vorlage: .env.example)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kindkes
      POSTGRES_PASSWORD: ${DB_PASSWORT:?DB_PASSWORT in .env setzen}
      POSTGRES_DB: kindkes
    volumes:
      - db-daten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kindkes -d kindkes"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: kindkesmoeoen-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kindkes:${DB_PASSWORT}@db:5432/kindkes
      SITZUNG_STUNDEN: ${SITZUNG_STUNDEN:-12}
      DEMO_MODUS: ${DEMO_MODUS:-nein}
      ZWEI_FAKTOR_PFLICHT: ${ZWEI_FAKTOR_PFLICHT:-nein}
      # Routing-Server für echte Straßenstrecken (scripts/karte-einrichten.sh); leer = Schätzung aus der Luftlinie
      OSRM_URL: ${OSRM_URL:-}
      # Online-Adresssuche, falls das eigene Adressverzeichnis nichts findet ("aus" = abgeschaltet)
      GEOCODER_URL: ${GEOCODER_URL:-}
      GEOCODER_KONTAKT: ${GEOCODER_KONTAKT:-}
      # Website, die die öffentliche Kursliste im Browser laden darf
      WEBSITE_URL: https://${WEBSITE_DOMAIN:-www.localhost}

  # Öffentliche Website (statisch, ohne Datenbank). Erreichbar unter WEBSITE_DOMAIN.
  website:
    build:
      context: .
      dockerfile: Dockerfile.website
      args:
        SITE_URL: https://${WEBSITE_DOMAIN:-www.localhost}
        PUBLIC_APP_URL: https://${DOMAIN}
    image: kindkesmoeoen-website:latest
    restart: unless-stopped
    environment:
      APP_URL: https://${DOMAIN}

  # Routing (OpenStreetMap, Mecklenburg-Vorpommern). Einrichten mit scripts/karte-einrichten.sh,
  # das Skript setzt COMPOSE_PROFILES=karte in .env, danach startet "docker compose up -d" ihn mit.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["karte"]
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 200 /data/karte.osrm
    volumes:
      - ./karte:/data:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
      - website
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN in .env setzen}
      WEBSITE_DOMAIN: ${WEBSITE_DOMAIN:-www.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-daten:/data
      - caddy-config:/config

volumes:
  db-daten:
  caddy-daten:
  caddy-config:
